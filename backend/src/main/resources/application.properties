# Server Port Configuration
server.port=8080

# Database DataSource Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/traffic_police_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable CORS for development
# Allowed origins will be handled in a WebConfig or Controller level annotation
